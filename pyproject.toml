[build-system]
requires = ["setuptools>=61", "cmake>=3.20", "ninja>=1.11", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "flagtree-q"
version = "0.1.0"
description = "MLIR-based quantum compiler infrastructure for FlagTree-Q"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
flagtree-q = "flagtree_q.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["flagtree_q*"]

[tool.setuptools.package-data]
flagtree_q = ["py.typed"]
